server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) resolves the "backend" service name.
    # Using a variable in proxy_pass (rather than a bare hostname) forces
    # nginx to re-resolve it per the TTL below instead of caching whatever
    # IP "backend" had at nginx startup forever -- without this, recreating
    # the backend container (a redeploy, `docker compose up -d --force-recreate
    # backend`, etc.) leaves this container proxying to a dead IP until it's
    # also restarted. Confirmed by hitting exactly that: a rebuilt backend
    # container got a new IP and every API call 502'd until frontend restarted.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream backend:8000;

    # Single-page app: any unmatched route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies API calls to the backend container so the browser only ever
    # talks to one origin -- avoids CORS entirely in production.
    #
    # Deliberately no URI segment after $backend_upstream: with a variable
    # in proxy_pass, nginx does NOT do its usual location-prefix rewriting
    # (that only happens for a literal proxy_pass target) -- it would
    # instead send the *literal* proxy_pass URI verbatim and silently drop
    # the rest of the original request path. Confirmed by hitting exactly
    # that: `POST /api/jobs` arrived at the backend as `POST /api/` (the
    # `jobs` segment vanished) with `proxy_pass http://$backend_upstream/api/;`.
    # Omitting the URI entirely makes nginx forward the original request URI
    # unchanged, which is what we want here since the backend's own routes
    # already include their full path (`/api/jobs`, `/health`).
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 550M;
    }

    location /health {
        proxy_pass http://$backend_upstream;
    }
}
